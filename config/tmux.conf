# ─── PREFIX ───────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── GENERAL ──────────────────────────────────────────────────────────────────
# Pastikan env Wayland/X11 tersedia di dalam tmux
set -ga update-environment "DISPLAY WAYLAND_DISPLAY XAUTHORITY"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on
set -g extended-keys on
set -g extended-keys-format csi-u
set -sg escape-time 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# ─── MOUSE ────────────────────────────────────────────────────────────────────
set -g mouse on

# ─── PANE BORDER ──────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#cba6f7"

# ─── SPLIT PANES ──────────────────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ─── NAVIGATE PANES (Vim-style, dengan prefix) ────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Navigate pane TANPA prefix (Alt+arrow)
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

# ─── RESIZE PANES ─────────────────────────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── PINDAH / SWAP PANES ──────────────────────────────────────────────────────
# Geser posisi pane dalam window (swap urutan)
bind > swap-pane -D
bind < swap-pane -U

# Rotate semua pane dalam window
bind o rotate-window

# Zoom / fullscreen pane (toggle)
bind z resize-pane -Z

# Break pane → jadi window baru (buka sendiri)
bind b break-pane -d

# Ambil pane dari window lain ke sini
bind @ command-prompt -p "Gabung pane dari (mis: 2 atau 2.1):" "join-pane -s '%%'"

# Kirim pane aktif ke window lain
bind M command-prompt -p "Kirim pane ke window (mis: 3):" "join-pane -t '%%'"

# Mark pane untuk operasi manual (default tetap ada via prefix+m bawaan)

# ─── WINDOW NAVIGATION ────────────────────────────────────────────────────────
bind -r p previous-window
bind -r n next-window
bind Tab last-window           # toggle window terakhir yang aktif

# Pilih window langsung (Alt+angka, tanpa prefix)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6

# ─── COPY MODE (Vim-style) ────────────────────────────────────────────────────
set -g mode-keys vi
bind Enter copy-mode

# v = mulai seleksi, C-v = block selection, Escape = batal
bind -T copy-mode-vi v      send-keys -X begin-selection
bind -T copy-mode-vi C-v    send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel

# y ditangani tmux-yank via @override_copy_command (lihat PLUGIN CONFIG)

# Mouse drag → copy ke clipboard
bind -T copy-mode-vi MouseDragEnd1Pane \
  send-keys -X copy-pipe-and-cancel "$HOME/.local/bin/tmux-clip"

# Double-click: select kata → copy
bind -T copy-mode-vi DoubleClick1Pane \
  select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "$HOME/.local/bin/tmux-clip"
bind -n DoubleClick1Pane \
  select-pane \; copy-mode -M \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "$HOME/.local/bin/tmux-clip"

# Triple-click: select baris → copy
bind -T copy-mode-vi TripleClick1Pane \
  select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "$HOME/.local/bin/tmux-clip"
bind -n TripleClick1Pane \
  select-pane \; copy-mode -M \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "$HOME/.local/bin/tmux-clip"

# ─── QUICK RELOAD ─────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ─── LAYOUT PRESET (Claude Code dev) ─────────────────────────────────────────
# prefix+D: editor kiri | claude kanan, terminal kiri-bawah
bind D \
  split-window -h -c "#{pane_current_path}" \; \
  select-pane -L \; \
  split-window -v -c "#{pane_current_path}" \; \
  select-pane -t 1

# ─── PLUGINS ──────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# ─── PLUGIN CONFIG ────────────────────────────────────────────────────────────
# tmux-yank: pakai wrapper (Wayland + X11 fallback)
set -g @override_copy_command "$HOME/.local/bin/tmux-clip"
set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'clipboard'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_right_separator "█"

set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_date_time}"
set -g @catppuccin_date_time_text " %H:%M  %d/%m"

# ─── TPM INIT (harus di baris paling bawah) ───────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'
