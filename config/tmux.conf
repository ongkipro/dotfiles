# ─── PREFIX ───────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── GENERAL ──────────────────────────────────────────────────────────────────
set -ga update-environment "DISPLAY WAYLAND_DISPLAY XAUTHORITY SSH_AUTH_SOCK SSH_AGENT_PID"

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,screen-256color:RGB,tmux-256color:RGB"
set -g history-limit 100000
set -g display-time 3000
set -g status-interval 5
set -g focus-events on
set -g extended-keys on
set -g extended-keys-format csi-u
set -sg escape-time 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g allow-rename off
set -g allow-passthrough on
set -g set-clipboard on

# ─── UI / THEME (Catppuccin-inspired, plain-font friendly) ───────────────────
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g message-style "bg=#89b4fa,fg=#1e1e2e,bold"
set -g message-command-style "bg=#a6e3a1,fg=#1e1e2e,bold"
set -g mode-style "bg=#f9e2af,fg=#1e1e2e,bold"
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#cba6f7"
set -g status-left-length 40
set -g status-right-length 120
set -g window-status-separator ""
set -g window-status-format "#[fg=#a6adc8,bg=#313244]  #I:#W  "
set -g window-status-current-format "#[fg=#1e1e2e,bg=#cba6f7,bold]  #I:#W  "
set -g window-status-last-style "fg=#1e1e2e,bg=#89b4fa"
set -g window-status-activity-style "fg=#1e1e2e,bg=#f9e2af"
set -g status-left "#[fg=#1e1e2e,bg=#a6e3a1,bold]  #S  #[fg=#1e1e2e,bg=#89b4fa]#{?client_prefix, PREFIX ,}#[default]#{prefix_highlight}"
set -g status-right "#[fg=#cdd6f4,bg=#313244] #{b:pane_current_path} #[fg=#1e1e2e,bg=#f9e2af] #($HOME/.local/bin/tmux-battery) #[fg=#1e1e2e,bg=#89b4fa] %H:%M #[fg=#1e1e2e,bg=#a6e3a1] %d/%m "

# ─── WINDOWS / PANES ─────────────────────────────────────────────────────────
set -g mouse on
setw -g mode-keys vi
setw -g automatic-rename on
setw -g automatic-rename-format "#W"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Split tanpa prefix
bind -n M-\\ split-window -h -c "#{pane_current_path}"
bind -n M--  split-window -v -c "#{pane_current_path}"

# Pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R
bind -n C-Left  select-pane -L
bind -n C-Down  select-pane -D
bind -n C-Up    select-pane -U
bind -n C-Right select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up    resize-pane -U 5
bind -n M-S-Down  resize-pane -D 5

# Move panes around
bind > swap-pane -D
bind < swap-pane -U
bind o rotate-window
bind z resize-pane -Z
bind b break-pane -d
bind @ command-prompt -p "Gabung pane dari (mis: 2 atau 2.1):" "join-pane -s '%%'"
bind M command-prompt -p "Kirim pane ke window (mis: 3):" "join-pane -t '%%'"
bind y setw synchronize-panes \; display "Sync panes: #{?synchronize-panes,ON,OFF}"

# Popup / utility
bind ` display-popup -E -w 80% -h 60% -d "#{pane_current_path}" "bash"
bind C-l send-keys C-l \; run-shell "tmux clear-history"

# Window navigation
bind -r p previous-window
bind -r n next-window
bind Tab last-window
bind -n M-[ previous-window
bind -n M-] next-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ─── COPY MODE ────────────────────────────────────────────────────────────────
bind Enter copy-mode
bind -T copy-mode-vi v      send-keys -X begin-selection
bind -T copy-mode-vi C-v    send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi y      send-keys -X copy-pipe-and-cancel "$HOME/.local/bin/tmux-clip"
bind -T copy-mode-vi Y      send-keys -X copy-line-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane \
  send-keys -X copy-pipe-and-cancel "$HOME/.local/bin/tmux-clip"
bind -T copy-mode-vi DoubleClick1Pane \
  select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "$HOME/.local/bin/tmux-clip"
bind -n DoubleClick1Pane \
  select-pane \; copy-mode -M \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "$HOME/.local/bin/tmux-clip"
bind -T copy-mode-vi TripleClick1Pane \
  select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "$HOME/.local/bin/tmux-clip"
bind -n TripleClick1Pane \
  select-pane \; copy-mode -M \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "$HOME/.local/bin/tmux-clip"

# ─── QUICK ACTIONS ────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
bind -n C-r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
bind ? list-keys -N -T root \; list-keys -N -T prefix
bind U run-shell '~/.tmux/plugins/tpm/bin/update_plugins all' \; display "tmux plugins updated"
bind S run-shell '~/.tmux/plugins/tmux-resurrect/scripts/save.sh' \; display "tmux session saved"
bind R run-shell '~/.tmux/plugins/tmux-resurrect/scripts/restore.sh' \; display "tmux session restored"

# Claude / editor layout
bind D \
  split-window -h -c "#{pane_current_path}" \; \
  select-pane -L \; \
  split-window -v -c "#{pane_current_path}" \; \
  select-pane -t 1

# ─── PLUGINS ──────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-open'

# ─── PLUGIN CONFIG ────────────────────────────────────────────────────────────
set -g @override_copy_command "$HOME/.local/bin/tmux-clip"
set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'clipboard'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_fg '#1e1e2e'
set -g @prefix_highlight_bg '#f38ba8'
set -g @prefix_highlight_copy_mode_attr 'fg=#1e1e2e,bg=#a6e3a1,bold'
set -g @prefix_highlight_output_prefix ' '
set -g @prefix_highlight_output_suffix ' '

# ─── TPM INIT (baris terakhir) ────────────────────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'
