setupVersion: 1
modelRoles:
  smol: google-antigravity/gemini-3.7-flash:medium
  slow: openai-codex/gpt-5.6-sol:high
  plan: openai-codex/gpt-5.6-sol:high
  vision: google-antigravity/gemini-3.1-pro:high
  designer: google-antigravity/gemini-3.1-pro:high
  research: google-antigravity/gemini-3.7-flash:high
  discovery: anthropic/claude-sonnet-5:medium
  tiny: google-antigravity/gemini-3.1-flash-lite:minimal
  task: openai-codex/gpt-5.6-sol:high
  default: openai-codex/gpt-5.6-sol:medium
  advisor: anthropic/claude-sonnet-5:high
  advisor-xhigh: anthropic/claude-opus-5:xhigh
  advisor-max: anthropic/claude-opus-5:max
modelProviderOrder:
  - google-antigravity
  - openai-codex
  - anthropic
cycleOrder:
  - smol
  - default
  - slow
defaultThinkingLevel: auto
display:
  # Static working state avoids high-frequency full-frame repaint through tmux/SSH.
  shimmer: disabled
tui:
  # The animated OSC title is an independent redraw loop while OMP is working.
  titleState: false
retry:
  enabled: true
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    # Normal routes span all three direct providers. Advisor and discovery keep
    # Codex for the final availability hop only; that hop is not independent review.
    # 9Router remains an explicit reserve in models.yml, never a normal fallback.
    default:
      - google-antigravity/gemini-3.7-flash:medium
      - anthropic/claude-sonnet-4-6:medium
    task:
      - google-antigravity/gemini-3.7-flash:high
      - anthropic/claude-sonnet-4-6:medium
    smol:
      - openai-codex/gpt-5.4-mini:low
      - anthropic/claude-haiku-4-5:low
    tiny:
      - anthropic/claude-haiku-4-5:minimal
      - openai-codex/gpt-5.4-mini:low
    slow:
      - google-antigravity/claude-opus-4-6:high
      - anthropic/claude-opus-4-8:high
    plan:
      - anthropic/claude-opus-4-8:high
      - google-antigravity/claude-opus-4-6:high
    vision:
      - anthropic/claude-sonnet-5:high
      - openai-codex/gpt-5.4:high
    designer:
      - anthropic/claude-sonnet-5:high
      - openai-codex/gpt-5.4:high
    research:
      - openai-codex/gpt-5.4:high
      - anthropic/claude-sonnet-4-6:high
    discovery:
      - google-antigravity/gemini-3.7-flash:high
      - openai-codex/gpt-5.4:high
    advisor:
      - google-antigravity/claude-sonnet-4-6:high
      - openai-codex/gpt-5.6-sol:high
    anthropic/claude-opus-5:
      - google-antigravity/claude-opus-4-6:high
      - openai-codex/gpt-5.6-sol:high
async:
  enabled: true
  maxJobs: 8
task:
  batch: true
  maxConcurrency: 8
  maxRecursionDepth: 1
  enableLsp: true
  showResolvedModelBadge: true
  isolation:
    mode: auto
    apply: false
    merge: patch
  agentModelOverrides:
    scout: "@discovery"
    sonic: "@smol"
    designer: "@vision"
    reviewer: "@advisor"
    security-reviewer: "@advisor-xhigh"
    librarian: "@research"
    task: "@task"
    complex-developer: "@slow"
    architect: "@advisor-max"
    debugger: "@advisor-xhigh"
    writer: "@plan"
compaction:
  enabled: true
  strategy: snapcompact
  midTurnEnabled: true
  autoContinue: true
  thresholdTokens: 140000
  keepRecentTokens: 40000
  dropUseless: true
  idleEnabled: true
  idleThresholdTokens: 100000
tools:
  format: auto
  approvalMode: yolo
bash:
  # First-match deny rules are the mechanical floor beneath yolo. Keep broad
  # forms after specific ones so path-prefixed Git and shell wrappers are caught.
  patterns:
    - match: "*git push --force*"
      approval: deny
    - match: "*git push -f *"
      approval: deny
    - match: "*git push -f"
      approval: deny
    - match: "*git reset --hard*"
      approval: deny
    - match: "*git clean -f*"
      approval: deny
    - match: "*git commit --amend*"
      approval: deny
    - match: "*rm -rf *"
      approval: deny
    - match: "*sudo *"
      approval: deny
    - match: "*wrangler deploy*"
      approval: deny
    - match: "*shopify theme push*"
      approval: deny
secrets:
  enabled: true
dev:
  autoqaConsent: granted
