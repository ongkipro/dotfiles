# CROSS-DEVICE REFERENCE: recommended OMP model-role profile.
#
# This file is secret-free and executable as an explicit overlay:
#   omp --config ~/dotfiles/config/omp/config.yml
#
# It is not installed, linked, or auto-loaded. OMP continues to own native
# settings, authentication, sessions, caches, and device-local capacity choices
# under ~/.omp/agent/.
providers:
  webSearchOrder: []
setupVersion: 2
modelRoles:
  default: openai-codex/gpt-5.6-terra:medium
  task: openai-codex/gpt-5.6-sol:high
  slow: openai-codex/gpt-5.6-sol:high
  plan: anthropic/claude-fable-5:high
  orchestrator: anthropic/claude-fable-5:high
  smol: google-antigravity/gemini-3.7-flash:medium
  tiny: google-antigravity/gemini-3.7-flash:low
  vision: anthropic/claude-opus-5:high
  designer: anthropic/claude-opus-5:high
  commit: openai-codex/gpt-5.6-luna:low
  title: google-antigravity/gemini-3.7-flash:low
  research: openai-codex/gpt-5.6-terra:medium
  discovery: openai-codex/gpt-5.6-terra:medium
  advisor: anthropic/claude-opus-5:high
  advisor-xhigh: anthropic/claude-opus-5:xhigh
defaultThinkingLevel: auto
dev:
  autoqaConsent: granted
modelProviderOrder:
  - anthropic
  - google-antigravity
  - openai-codex
cycleOrder:
  - smol
  - default
  - slow
retry:
  fallbackChains:
    default:
      - openai-codex/gpt-5.6-sol:medium
      - anthropic/claude-opus-5:medium
    task:
      - anthropic/claude-opus-5:high
      - openai-codex/gpt-5.6-terra:high
    slow:
      - anthropic/claude-opus-5:high
      - openai-codex/gpt-5.6-terra:max
    plan:
      - anthropic/claude-opus-5:xhigh
      - openai-codex/gpt-5.6-sol:xhigh
    orchestrator:
      - anthropic/claude-opus-5:xhigh
      - openai-codex/gpt-5.6-sol:xhigh
    smol:
      - openai-codex/gpt-5.6-luna:low
      - anthropic/claude-haiku-4-5:low
    tiny:
      - openai-codex/gpt-5.6-luna:low
      - anthropic/claude-haiku-4-5:minimal
    vision:
      - openai-codex/gpt-5.6-sol:high
      - openai-codex/gpt-5.6-terra:high
    designer:
      - openai-codex/gpt-5.6-sol:high
      - openai-codex/gpt-5.6-terra:high
    commit:
      - google-antigravity/gemini-3.7-flash:low
      - anthropic/claude-haiku-4-5:low
    title:
      - openai-codex/gpt-5.6-luna:low
      - anthropic/claude-haiku-4-5:minimal
    research:
      - openai-codex/gpt-5.6-sol:medium
      - anthropic/claude-opus-5:medium
    discovery:
      - openai-codex/gpt-5.6-sol:medium
      - anthropic/claude-opus-5:medium
    advisor:
      - openai-codex/gpt-5.6-sol:high
      - openai-codex/gpt-5.6-terra:high
    advisor-xhigh:
      - openai-codex/gpt-5.6-sol:xhigh
      - openai-codex/gpt-5.6-terra:max
advisor:
  enabled: false
prewalk:
  enabled: false
goal:
  enabled: true
  statusInFooter: true
  continuationModes:
    - interactive
todo:
  enabled: true
  reminders: true
  eager: preferred
task:
  eager: preferred
  batch: true
  enableEffort: true
  showResolvedModelBadge: true
  isolation:
    mode: auto
    apply: false
  maxConcurrency: 4
  maxRecursionDepth: 1
  softRequestBudget: 80
  enableLsp: true
  prewalk: false
  agentModelOverrides:
    designer: "@vision"
    librarian: "@research"
    reviewer: "@advisor"
    scout: "@discovery"
    security-reviewer: "@advisor-xhigh"
    sonic: "@smol"
    task: "@task"
memory:
  backend: "off"
memories:
  maxRolloutsPerStartup: 64
  stage1Concurrency: 8
