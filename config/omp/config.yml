      - google-antigravity/gemini-3.7-flash:high
async: 
  enabled: true
  maxJobs: 8
task:
  batch: true
  maxConcurrency: 8
  showResolvedModelBadge: true
  isolation: 
    mode: auto
    apply: true
    merge: patch
  agentModelOverrides: 
    scout: "@discovery"
    sonic: "@smol"
    designer: "@vision"
    reviewer: "@advisor"
    security-reviewer: "@advisor-xhigh"
    librarian: "@research"
    task: "@task"
    complex-developer: "@slow"
    architect: "@advisor-max"
    debugger: "@advisor-xhigh"
    writer: "@plan"
compaction: 
  enabled: true
  strategy: snapcompact
  midTurnEnabled: true
  autoContinue: true
  thresholdTokens: 120000
  keepRecentTokens: 40000
  dropUseless: true
  idleEnabled: true
  idleThresholdTokens: 100000
tools: 
  format: auto
  approvalMode: yolo
secrets: 
  enabled: true
dev: 
  autoqaConsent: granted