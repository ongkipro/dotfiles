# CROSS-DEVICE REFERENCE: recommended OMP model-role profile.
#
# This file is secret-free and executable as an explicit overlay:
#   omp --config ~/dotfiles/config/omp/config.yml
#
# It is not installed, linked, or auto-loaded. OMP continues to own native
# settings, authentication, sessions, caches, and device-local capacity choices
# under ~/.omp/agent/.
providers:
  webSearchOrder: []
setupVersion: 2
modelRoles:
  default: openai-codex/gpt-5.6-terra:medium
  task: openai-codex/gpt-5.6-terra:medium
  slow: openai-codex/gpt-5.6-sol:high
  plan: openai-codex/gpt-5.6-terra:high
  smol: google-antigravity/gemini-3.7-flash:medium
  tiny: google-antigravity/gemini-3.7-flash:low
  vision: anthropic/claude-opus-5:high
  designer: anthropic/claude-opus-5:high
  commit: openai-codex/gpt-5.6-luna:low
  title: google-antigravity/gemini-3.7-flash:low
  research: google-antigravity/gemini-3.7-flash:medium
  discovery: google-antigravity/gemini-3.7-flash:high
  advisor: anthropic/claude-sonnet-5:high
  advisor-xhigh: anthropic/claude-opus-5:xhigh
  advisor-max: anthropic/claude-opus-5:max
defaultThinkingLevel: auto
dev:
  autoqaConsent: granted
modelProviderOrder:
  - anthropic
  - google-antigravity
  - openai-codex
cycleOrder:
  - smol
  - default
  - slow
retry:
  fallbackChains:
    default:
      - google-antigravity/gemini-3.7-flash:high
      - anthropic/claude-sonnet-5:medium
    task:
      - google-antigravity/gemini-3.7-flash:high
      - anthropic/claude-sonnet-5:medium
    slow:
      - google-antigravity/claude-opus-4-6:high
      - anthropic/claude-opus-5:high
    plan:
      - google-antigravity/claude-opus-4-6:high
      - anthropic/claude-opus-5:high
    smol:
      - openai-codex/gpt-5.6-luna:low
      - anthropic/claude-haiku-4-5:low
    tiny:
      - openai-codex/gpt-5.6-luna:low
      - anthropic/claude-haiku-4-5:minimal
    vision:
      - google-antigravity/gemini-3.7-flash:high
      - openai-codex/gpt-5.6-sol:high
    designer:
      - google-antigravity/gemini-3.7-flash:high
      - openai-codex/gpt-5.6-sol:high
    commit:
      - google-antigravity/gemini-3.7-flash:low
      - anthropic/claude-haiku-4-5:low
    title:
      - openai-codex/gpt-5.6-luna:low
      - anthropic/claude-haiku-4-5:minimal
    research:
      - openai-codex/gpt-5.6-terra:medium
      - anthropic/claude-sonnet-5:medium
    discovery:
      - anthropic/claude-sonnet-5:high
      - openai-codex/gpt-5.6-terra:medium
    advisor:
      - google-antigravity/claude-sonnet-4-6:high
      - openai-codex/gpt-5.6-sol:high
    advisor-xhigh:
      - google-antigravity/claude-opus-4-6:high
      - openai-codex/gpt-5.6-sol:xhigh
    advisor-max:
      - google-antigravity/claude-opus-4-6:high
      - openai-codex/gpt-5.6-sol:max
task:
  agentModelOverrides:
    designer: "@vision"
    librarian: "@research"
    reviewer: "@advisor"
    scout: "@discovery"
    security-reviewer: "@advisor-xhigh"
    sonic: "@smol"
    task: "@task"
memory:
  backend: "off"
memories:
  maxRolloutsPerStartup: 64
  stage1Concurrency: 8
