setupVersion: 1
modelRoles:
  smol: google-antigravity/gemini-3.1-flash-lite:medium
  slow: openai-codex/gpt-5.6-sol:high
  plan: google-antigravity/claude-opus-4-6:high
  vision: google-antigravity/gemini-3.1-pro:high
  designer: google-antigravity/gemini-3.1-pro:high
  research: google-antigravity/gemini-3.6-flash:high
  tiny: google-antigravity/gemini-3.1-flash-lite:minimal
  task: openai-codex/gpt-5.6-sol:medium
  default: google-antigravity/gemini-3.6-flash:medium
  advisor: anthropic/claude-sonnet-5:high
  advisor-xhigh: anthropic/claude-opus-5:xhigh
  advisor-max: anthropic/claude-opus-5:max
modelProviderOrder:
  - google-antigravity
  - openai-codex
  - anthropic
  - 9router-fantastico
cycleOrder: 
  - smol
  - default
  - slow
defaultThinkingLevel: auto
retry: 
  enabled: true
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains: 
    default:
      - 9router-fantastico/ag/gemini-3.6-flash-medium
      - openai-codex/gpt-5.4:medium
    task:
      - google-antigravity/gemini-3.6-flash:high
      - 9router-fantastico/cx/gpt-5.6-sol
    smol:
      - 9router-fantastico/gc/gemini-3.1-flash-lite-preview
      - 9router-fantastico/ag/gemini-3.6-flash-low
    tiny:
      - 9router-fantastico/gc/gemini-3.1-flash-lite-preview
      - 9router-fantastico/ag/gemini-3.6-flash-low
    slow:
      - google-antigravity/claude-opus-4-6:high
      - 9router-fantastico/cx/gpt-5.6-sol
      - anthropic/claude-opus-4-8:high
    plan:
      - openai-codex/gpt-5.6-sol:high
      - 9router-fantastico/ag/claude-opus-4-6-thinking
      - anthropic/claude-opus-4-8:high
    vision:
      - 9router-fantastico/gc/gemini-3.1-pro-preview
      - 9router-fantastico/ag/gemini-3.1-pro-low
    designer:
      - 9router-fantastico/gc/gemini-3.1-pro-preview
      - 9router-fantastico/ag/gemini-3.1-pro-low
    research:
      - 9router-fantastico/ag/gemini-3.6-flash-high
      - 9router-fantastico/gc/gemini-3.1-flash-lite-preview
    advisor:
      - google-antigravity/claude-sonnet-4-6:high
      - openai-codex/gpt-5.6-sol:high
      - 9router-fantastico/cx/gpt-5.5
    anthropic/claude-sonnet-5:
      - google-antigravity/claude-sonnet-4-6:high
      - openai-codex/gpt-5.6-sol:high
      - 9router-fantastico/cx/gpt-5.5
    anthropic/claude-opus-5:
      - google-antigravity/claude-opus-4-6:high
      - openai-codex/gpt-5.6-sol:high
      - 9router-fantastico/cx/gpt-5.5
async:
  enabled: true
  maxJobs: 8
task:
  batch: true
  maxConcurrency: 8
  showResolvedModelBadge: true
  isolation:
    mode: auto
    apply: true
    merge: patch
  agentModelOverrides:
    scout: "@smol"
    sonic: "@smol"
    designer: "@vision"
    reviewer: "@advisor"
    security-reviewer: "@advisor-xhigh"
    librarian: "@research"
    task: "@task"
    complex-developer: "@slow"
    architect: "@advisor-max"
    debugger: "@advisor-xhigh"
compaction:
  enabled: true
  strategy: snapcompact
  midTurnEnabled: true
  autoContinue: true
  thresholdTokens: 140000
  keepRecentTokens: 40000
  dropUseless: true
  idleEnabled: true
  idleThresholdTokens: 100000
tools: 
  format: auto
  approvalMode: yolo
secrets:
  enabled: true
dev: 
  autoqaConsent: granted
