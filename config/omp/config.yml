# OMP config — audited 2026-08-07
# Primary: openai-codex (free tier, built-in, no API key needed)
# Fallback: 9router (when credentials/tunnel are active)
setupVersion: 1

# Default model — openai-codex free tier (always available)
model: openai-codex/gpt-5.4
thinking: high
theme: dark

# Role-based model routing
smol: openai-codex/gpt-5.4-mini
slow: openai-codex/gpt-5.5
plan: openai-codex/gpt-5.5

# Compaction
compaction:
  enabled: true
  reserveTokens: 22000
  keepRecentTokens: 6000

# Tools — no approval prompts
tools:
  approvalMode: yolo