# OMP runs on its upstream defaults (owner decision 2026-10-31).
#
# This reference is intentionally empty of overrides. Do not add model roles,
# fallback chains, retry tuning or task limits here: OMP's built-in values already
# cover them (retry.maxRetries 10, retry.maxDelayMs 300000), and each override we
# added before was a guess that later had to be undone. Choose models in OMP with
# /model; the choice is saved by OMP in ~/.omp/agent/config.yml on that device.
#
# Connecting 9Router is a provider declaration in the device's own models.yml,
# documented in README.md. It is not a setting and does not belong here.
#
# Loadable as an explicit overlay (a no-op by design):
#   omp --config ~/dotfiles/config/omp/config.yml
{}
