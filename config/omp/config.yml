setupVersion: 1
modelRoles:
  smol: google-antigravity/gemini-3.1-flash-lite:medium
  slow: google-antigravity/gemini-3.1-pro:high
  plan: google-antigravity/gemini-3.1-pro:high
  vision: google-antigravity/gemini-3.1-pro:high
  designer: google-antigravity/gemini-3.1-pro:high
  research: google-antigravity/gemini-3.7-flash:high
  discovery: anthropic/claude-sonnet-5:medium
  tiny: google-antigravity/gemini-3.1-flash-lite:minimal
  task: google-antigravity/gemini-3.1-pro:medium
  default: google-antigravity/gemini-3.1-pro:medium
  advisor: google-antigravity/gemini-3.1-pro:high
  advisor-xhigh: google-antigravity/gemini-3.1-pro:xhigh
  advisor-max: google-antigravity/gemini-3.1-pro:max
modelProviderOrder:
  - google-antigravity
agents:
  enabled: true
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    default:
      - google-antigravity/gemini-3.1-pro:medium
    task:
      - google-antigravity/gemini-3.1-pro:medium
    smol:
      - google-antigravity/gemini-3.6-flash:low
    tiny:
      - google-antigravity/gemini-3.1-flash-lite:minimal
    slow:
      - google-antigravity/gemini-3.1-pro:high
    plan:
      - google-antigravity/gemini-3.1-pro:high
    vision:
      - google-antigravity/gemini-3.1-pro:high
    designer:
      - google-antigravity/gemini-3.1-pro:high
    research:
      - google-antigravity/gemini-3.6-flash:high
    advisor:
      - google-antigravity/gemini-3.1-pro:high
async:
  isolation: 
    mode: auto
    apply: true
    merge: patch
  agentModelOverrides:
    scout: "@smol"
    sonic: "@smol"
    designer: "@vision"
    reviewer: "@advisor"
    security-reviewer: "@advisor-xhigh"
    librarian: "@research"
    task: "@task"
    complex-developer: "@slow"
    architect: "@advisor-max"
    debugger: "@advisor-xhigh"
    writer: "@plan"
compaction:
  enabled: true
  strategy: snapcompact
  midTurnEnabled: true
  autoContinue: true
  thresholdTokens: 140000
  keepRecentTokens: 40000
  dropUseless: true
  idleEnabled: true
  idleThresholdTokens: 100000
tools:
  format: auto
  approvalMode: yolo
secrets:
  enabled: true
dev:
  autoqaConsent: granted
