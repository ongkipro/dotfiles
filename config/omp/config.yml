setupVersion: 1
modelRoles:
  smol: google-antigravity/gemini-3.1-flash-lite
  slow: openai-codex/gpt-5.6-sol:high
  plan: openai-codex/gpt-5.6-sol:high
  vision: google-antigravity/gemini-3.1-pro
  tiny: google-antigravity/gemini-3.1-flash-lite
  task: openai-codex/gpt-5.6-sol:medium
  default: openai-codex/gpt-5.6-sol:medium
  advisor: anthropic/claude-opus-4-8:high
modelProviderOrder:
  - openai-codex
  - google-antigravity
  - anthropic
  - 9router-fantastico
cycleOrder: 
  - smol
  - default
  - slow
defaultThinkingLevel: auto
retry: 
  enabled: true
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains: 
    default: 
      - openai-codex/gpt-5.6-sol
      - 9router-fantastico/cx/gpt-5.6-sol
    smol: 
      - 9router-fantastico/ag/gemini-3.5-flash-extra-low
      - openai-codex/gpt-5.4-mini
    slow:
      - anthropic/claude-opus-4-8:high
      - 9router-fantastico/cx/gpt-5.5
    plan:
      - anthropic/claude-opus-4-8:high
      - 9router-fantastico/cx/gpt-5.5
async:
  enabled: true
  maxJobs: 8
task:
  batch: true
  maxConcurrency: 8
  showResolvedModelBadge: true
  isolation:
    mode: auto
    apply: true
    merge: patch
  agentModelOverrides:
    scout: "@smol"
    sonic: "@smol"
    designer: "@vision"
    reviewer: "@advisor"
    security-reviewer: "@advisor"
    librarian: "@slow"
    task: "@task"
    complex-developer: "@slow"
    architect: "@advisor"
    debugger: "@advisor"
compaction: 
  enabled: true
  strategy: snapcompact
  midTurnEnabled: true
  autoContinue: true
tools: 
  format: auto
  approvalMode: yolo
secrets:
  enabled: true
dev: 
  autoqaConsent: granted
