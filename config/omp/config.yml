setupVersion: 1
modelRoles: 
  smol: google-antigravity/gemini-3.1-flash-lite
  slow: openai-codex/gpt-5.5:high
  plan: openai-codex/gpt-5.5:high
  vision: google-antigravity/gemini-3.1-pro
  tiny: google-antigravity/gemini-3.1-flash-lite
  task: openai-codex/gpt-5.4
  default: openai-codex/gpt-5.6-sol
modelProviderOrder: 
  - google-antigravity
  - openai-codex
  - 9router-fantastico
cycleOrder: 
  - smol
  - default
  - slow
defaultThinkingLevel: auto
retry: 
  enabled: true
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains: 
    default: 
      - openai-codex/gpt-5.6-sol
      - 9router-fantastico/cx/gpt-5.6-sol
    smol: 
      - 9router-fantastico/ag/gemini-3.5-flash-extra-low
      - openai-codex/gpt-5.4-mini
    slow: 
      - 9router-fantastico/cx/gpt-5.5
      - google-antigravity/claude-opus-4-6:high
    plan: 
      - 9router-fantastico/cx/gpt-5.5
      - google-antigravity/claude-sonnet-4-6:high
compaction: 
  enabled: true
  strategy: snapcompact
  midTurnEnabled: true
  autoContinue: true
tools: 
  format: auto
  approvalMode: yolo
dev: 
  autoqaConsent: granted