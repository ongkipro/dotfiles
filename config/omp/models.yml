# OMP custom models — active 9Router tunnel models are discovered at runtime.
providers:
  9router-fantastico:
    baseUrl: https://rbq97ts.abc-tunnel.us/v1
    api: openai-completions
    apiKey: NINEROUTER_REMOTE_KEY
    name: 9Router Fantastico (tunnel)
    compat:
      supportsDeveloperRole: false
      supportsReasoningEffort: true
      maxTokensField: max_tokens
    discovery:
      type: openai-models-list
