# Antigravity primary + 9Router Fantastico Tunnel reserve overlay.
#
#   omp --config ~/dotfiles/config/omp/overlays/antigravity-hosted.yml
#
# Primary capacity runs entirely on Google Antigravity (Gemini 3.8 Flash and Claude Opus 4.6),
# avoiding consumption of limited MiniMax / OpenCode Go quotas.
#
# 9Router Fantastico Tunnel (cx/gpt-5.6-sol) serves as the cross-host availability
# fallback and reasoning escalation bridge.

__test_providers__: google-antigravity,9router-fantastico

modelRoles:
  default: google-antigravity/gemini-3.8-flash:medium
  task: google-antigravity/gemini-3.8-flash:high
  slow: google-antigravity/claude-opus-4-6:high
  plan: google-antigravity/claude-opus-4-6:high
  smol: google-antigravity/gemini-3.8-flash:medium
  tiny: google-antigravity/gemini-3.8-flash:medium
  research: google-antigravity/gemini-3.8-flash:high
  discovery: google-antigravity/gemini-3.8-flash:high
  vision: google-antigravity/gemini-3.8-flash:high
  designer: google-antigravity/gemini-3.8-flash:high
  advisor: google-antigravity/claude-sonnet-4-6:high
  advisor-xhigh: google-antigravity/claude-opus-4-6:high
  advisor-max: google-antigravity/claude-opus-4-6:high

modelProviderOrder:
  - google-antigravity
  - 9router-fantastico

cycleOrder:
  - smol
  - default
  - slow

defaultThinkingLevel: auto

retry:
  enabled: true
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    default:
      - 9router-fantastico/cx/gpt-5.6-terra:medium
      - google-antigravity/claude-sonnet-4-6:high
    task:
      - 9router-fantastico/cx/gpt-5.6-terra:medium
      - google-antigravity/claude-sonnet-4-6:high
    smol:
      - 9router-fantastico/cx/gpt-5.4-mini:low
      - google-antigravity/gemini-3.8-flash:medium
    tiny:
      - 9router-fantastico/cx/gpt-5.4-mini:low
      - google-antigravity/gemini-3.8-flash:medium
    slow:
      - 9router-fantastico/cx/gpt-5.6-sol:high
      - google-antigravity/claude-opus-4-6:high
    plan:
      - 9router-fantastico/cx/gpt-5.6-terra:high
      - google-antigravity/claude-opus-4-6:high
    vision:
      - 9router-fantastico/cx/gpt-5.6-sol:high
      - google-antigravity/claude-sonnet-4-6:high
    designer:
      - 9router-fantastico/cx/gpt-5.6-sol:high
      - google-antigravity/claude-sonnet-4-6:high
    research:
      - 9router-fantastico/cx/gpt-5.6-terra:medium
      - google-antigravity/gemini-3.1-pro:high
    discovery:
      - 9router-fantastico/cx/gpt-5.6-terra:medium
      - google-antigravity/gemini-3.1-pro:high
    advisor:
      - 9router-fantastico/cx/gpt-5.6-sol:high
      - google-antigravity/claude-opus-4-6:high
    advisor-xhigh:
      - 9router-fantastico/cx/gpt-5.6-sol:xhigh
      - google-antigravity/claude-opus-4-6:high
    advisor-max:
      - 9router-fantastico/cx/gpt-5.6-sol:max
      - google-antigravity/claude-opus-4-6:high
