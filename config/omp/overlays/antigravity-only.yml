# Single-provider session overlay: Antigravity only.
#
#   omp --config ~/dotfiles/config/omp/overlays/antigravity-only.yml
#
# Every role resolves to google-antigravity, so specialist agents stay on
# Antigravity too (they resolve through roles, not through model literals).
# Recovery stays inside Antigravity on purpose: a session pinned to one provider
# should fail within that provider rather than silently re-introducing the
# multi-model routing the operator just opted out of.
#
# Note on the advisor tier: Antigravity's Claude Opus 4.6 supports reasoning up
# to `high` only — no `xhigh`, no `max`. The advisor roles therefore flatten to
# `high` here. That is a real capability reduction, not a naming detail: a
# single-provider Antigravity session cannot reproduce the judgment ceiling that
# direct Anthropic Opus 5 provides.
__test_require_cross_host__: false

__test_providers__: google-antigravity

modelRoles:
  default: google-antigravity/gemini-3.8-flash:medium
  task: google-antigravity/gemini-3.8-flash:high
  slow: google-antigravity/claude-opus-4-6:high
  plan: google-antigravity/claude-opus-4-6:high
  smol: google-antigravity/gemini-3.8-flash:medium
  tiny: google-antigravity/gemini-3.8-flash:medium
  research: google-antigravity/gemini-3.8-flash:medium
  discovery: google-antigravity/gemini-3.8-flash:high
  vision: google-antigravity/gemini-3.8-flash:high
  designer: google-antigravity/gemini-3.8-flash:high
  advisor: google-antigravity/claude-sonnet-4-6:high
  advisor-xhigh: google-antigravity/claude-opus-4-6:high
  advisor-max: google-antigravity/claude-opus-4-6:high

modelProviderOrder:
  - google-antigravity

retry:
  enabled: true
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    default:
      - google-antigravity/gemini-3.1-pro:high
      - google-antigravity/claude-sonnet-4-6:high
    task:
      - google-antigravity/gemini-3.1-pro:high
      - google-antigravity/claude-sonnet-4-6:high
    slow:
      - google-antigravity/claude-sonnet-4-6:high
      - google-antigravity/gemini-3.1-pro:high
    plan:
      - google-antigravity/claude-sonnet-4-6:high
      - google-antigravity/gemini-3.1-pro:high
    smol:
      - google-antigravity/gemini-3.8-flash:medium
      - google-antigravity/gemini-3.8-flash:medium
    tiny:
      - google-antigravity/gemini-3.8-flash:medium
      - google-antigravity/gemini-3.8-flash:medium
    research:
      - google-antigravity/gemini-3.8-flash:high
      - google-antigravity/gemini-3.1-pro:high
    discovery:
      - google-antigravity/gemini-3.1-pro:high
      - google-antigravity/claude-sonnet-4-6:high
    vision:
      - google-antigravity/claude-sonnet-4-6:high
      - google-antigravity/gemini-2.5-pro:high
    designer:
      - google-antigravity/claude-sonnet-4-6:high
      - google-antigravity/gemini-2.5-pro:high
    advisor:
      - google-antigravity/claude-opus-4-6:high
      - google-antigravity/claude-sonnet-4-5:high
    # model-keyed chain covers both without duplicating role entries — the same
    # trick the tracked config.yml uses for anthropic/claude-opus-5. Without
    # this the highest-judgment tiers are the only roles with no recovery path.
    google-antigravity/claude-opus-4-6:
      - google-antigravity/claude-sonnet-4-6:high
      - google-antigravity/gemini-3.1-pro:high
