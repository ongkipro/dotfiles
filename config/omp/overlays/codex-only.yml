# Single-provider session overlay: Codex only.
#
#   omp --config ~/dotfiles/config/omp/overlays/codex-only.yml
#
# Every role resolves to openai-codex, so specialist agents stay on Codex too
# (they resolve through roles, not through model literals). Recovery stays
# inside Codex on purpose: a session pinned to one provider should fail within
# that provider rather than silently re-introducing the multi-model routing the
# operator just opted out of.
#
# In this single-provider role split, Terra at
# medium owns ordinary development (`default`, `task`) and Terra at high owns
# planning, while Sol at high stays reserved for complex, high-risk work
# (`slow`) and the advisor tiers. Recovery inverts that pair inside Codex, so a
# degraded Terra falls to Sol rather than leaving the pool.
#
# Constraints honoured, same as the main config:
#   - every context window exceeds compaction.thresholdTokens (140K), which
#     excludes gpt-5.3-codex-spark at 128K
#   - every reasoning suffix is a level the model actually supports
#   - vision/designer use an image-capable model
#
__test_require_cross_host__: false

__test_providers__: openai-codex

__test_require_providers__: false
modelRoles:
  default: openai-codex/gpt-5.6-terra:medium
  task: openai-codex/gpt-5.6-terra:medium
  slow: openai-codex/gpt-5.6-sol:high
  plan: openai-codex/gpt-5.6-terra:high
  smol: openai-codex/gpt-5.4-mini:low
  tiny: openai-codex/gpt-5.4-mini:low
  research: openai-codex/gpt-5.6-terra:high
  discovery: openai-codex/gpt-5.6-terra:high
  vision: openai-codex/gpt-5.6-terra:high
  designer: openai-codex/gpt-5.6-terra:high
  advisor: openai-codex/gpt-5.6-sol:high
  advisor-xhigh: openai-codex/gpt-5.6-sol:xhigh
  advisor-max: openai-codex/gpt-5.6-sol:max

modelProviderOrder:
  - openai-codex

retry:
  enabled: true
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    default:
      - openai-codex/gpt-5.6-sol:medium
      - openai-codex/gpt-5.5:medium
    task:
      - openai-codex/gpt-5.6-sol:medium
      - openai-codex/gpt-5.5:medium
    slow:
      - openai-codex/gpt-5.6-terra:high
      - openai-codex/gpt-5.5:high
    plan:
      - openai-codex/gpt-5.6-luna:high
      - openai-codex/gpt-5.5:high
    smol:
      - openai-codex/gpt-5.5:low
      - openai-codex/gpt-5.6-terra:low
    tiny:
      - openai-codex/gpt-5.5:low
      - openai-codex/gpt-5.6-terra:low
    research:
      - openai-codex/gpt-5.5:high
      - openai-codex/gpt-5.6-sol:high
    discovery:
      - openai-codex/gpt-5.5:high
      - openai-codex/gpt-5.6-sol:high
    vision:
      - openai-codex/gpt-5.5:high
      - openai-codex/gpt-5.6-sol:high
    designer:
      - openai-codex/gpt-5.5:high
      - openai-codex/gpt-5.6-sol:high
    advisor:
      - openai-codex/gpt-5.6-luna:high
      - openai-codex/gpt-5.5:high
    # `advisor-xhigh` and `advisor-max` both resolve to gpt-5.6-sol, so a
    # model-keyed chain covers both without duplicating role entries — the same
    # trick the tracked config.yml uses for anthropic/claude-opus-5. Without
    # this the highest-judgment tiers are the only roles with no recovery path.
    openai-codex/gpt-5.6-sol:
      - openai-codex/gpt-5.6-luna:high
      - openai-codex/gpt-5.5:high
