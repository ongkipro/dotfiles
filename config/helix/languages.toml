# Helix language servers — auto-detected from PATH + explicit config
# Run `hx --health` to check LSP status

[language-server.pyright]
command = "pyright-langserver"
args = ["--stdio"]

[language-server.ruff]
command = "ruff"
args = ["server"]

[language-server.typescript]
command = "typescript-language-server"
args = ["--stdio"]

[language-server.vscode-json]
command = "vscode-json-language-server"
args = ["--stdio"]

[language-server.vscode-html]
command = "vscode-html-language-server"
args = ["--stdio"]

[language-server.vscode-css]
command = "vscode-css-language-server"
args = ["--stdio"]

[language-server.tailwindcss]
command = "tailwindcss-language-server"
args = ["--stdio"]

[language-server.yaml]
command = "yaml-language-server"
args = ["--stdio"]

[language-server.bash]
command = "bash-language-server"
args = ["start"]

# --- Languages ---

[[language]]
name = "python"
language-servers = ["pyright", "ruff"]

[[language]]
name = "typescript"
language-servers = ["typescript", "tailwindcss"]

[[language]]
name = "tsx"
language-servers = ["typescript", "tailwindcss"]

[[language]]
name = "javascript"
language-servers = ["typescript", "tailwindcss"]

[[language]]
name = "json"
language-servers = ["vscode-json"]

[[language]]
name = "html"
language-servers = ["vscode-html", "tailwindcss"]

[[language]]
name = "css"
language-servers = ["vscode-css", "tailwindcss"]

[[language]]
name = "yaml"
language-servers = ["yaml"]

[[language]]
name = "bash"
language-servers = ["bash"]
