name: Development Specification Suite

on:
  push:
    paths:
      - "skills/local/development-spec-suite/**"
      - ".github/workflows/development-spec-suite.yml"
  pull_request:
    paths:
      - "skills/local/development-spec-suite/**"
      - ".github/workflows/development-spec-suite.yml"

permissions:
  contents: read

concurrency:
  group: development-spec-suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: skills/local/development-spec-suite
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile scripts
        run: python3 -m py_compile scripts/*.py
      - name: Run portable fixtures
        run: python3 scripts/test-suite.py
      - name: Audit source ledger
        run: python3 scripts/audit-sources.py
