name: Development Specification Suite

on:
  push:
    paths:
      - "skills/local/development-spec-suite/**"
      - ".github/workflows/development-spec-suite.yml"
  pull_request:
    paths:
      - "skills/local/development-spec-suite/**"
      - ".github/workflows/development-spec-suite.yml"

permissions:
  contents: read

concurrency:
  group: development-spec-suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: skills/local/development-spec-suite
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile scripts
        run: python3 -m py_compile scripts/*.py
      - name: Run portable fixtures
        run: python3 scripts/test-suite.py
      - name: Audit source ledger
        run: python3 scripts/audit-sources.py --as-of 2026-08-04
