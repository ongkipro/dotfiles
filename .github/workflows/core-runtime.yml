name: Core runtime

on:
  push:
    paths:
      - ".github/workflows/core-runtime.yml"
      - "TASKS.md"
      - "bin/**"
      - "config/ai/**"
      - "config/templates/**"
      - "config/omp/**"
      - "config/pi/**"
      - "config/shell-tools.sh"
      - "config/bashrc.tools.sh"
      - "config/zshrc.tools.sh"
      - "skills/**"
      - "docs/task-change-boundary.md"
      - "docs/project-init.md"
      - "install.sh"
      - "install-macos.sh"
  pull_request:
    paths:
      - ".github/workflows/core-runtime.yml"
      - "TASKS.md"
      - "bin/**"
      - "config/ai/**"
      - "config/templates/**"
      - "config/omp/**"
      - "config/pi/**"
      - "config/shell-tools.sh"
      - "config/bashrc.tools.sh"
      - "config/zshrc.tools.sh"
      - "skills/**"
      - "docs/task-change-boundary.md"
      - "docs/project-init.md"
      - "install.sh"
      - "install-macos.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    name: Self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          case "${RUNNER_OS}/${RUNNER_ARCH}" in
            Linux/X64)   artifact="linux_amd64"; checksum="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8" ;;
            Linux/ARM64) artifact="linux_arm64"; checksum="325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6" ;;
            macOS/X64)   artifact="darwin_amd64"; checksum="5b44c3bc2255115c9b69e30efc0fecdf498fdb63c5d58e17084fd5f16324c644" ;;
            macOS/ARM64) artifact="darwin_arm64"; checksum="aba9ced2dee8d27fecca3dc7feb1a7f9a52caefa1eb46f3271ea66b6e0e6953f" ;;
            *) echo "Unsupported runner: ${RUNNER_OS}/${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_${artifact}.tar.gz" \
            --output "$archive"
          python3 - "$archive" "$checksum" <<'PY'
          import hashlib
          from pathlib import Path
          import sys

          actual = hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest()
          if actual != sys.argv[2]:
              raise SystemExit(f"actionlint checksum mismatch: {actual}")
          PY
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Validate GitHub workflows
        run: actionlint

      - name: Run authoritative core suite
        # The suite uses local fixtures and synthetic credentials only. Turnstile
        # network calls are replaced by its fixture; no provider login is needed.
        env:
          DOTFILES_DIR: ${{ github.workspace }}
          NINEROUTER_REMOTE_KEY: ""
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: bin/ai-doctor --self-test
        shell: bash
