name: Core runtime

on:
  push:
    paths:
      - ".github/workflows/core-runtime.yml"
      - "TASKS.md"
      - "bin/**"
      - "config/ai/**"
      - "config/templates/**"
      - "config/omp/**"
      - "config/pi/**"
      - "config/shell-tools.sh"
      - "config/bashrc.tools.sh"
      - "config/zshrc.tools.sh"
      - "skills/**"
      - "docs/task-change-boundary.md"
      - "docs/project-init.md"
      - "install.sh"
      - "install-macos.sh"
  pull_request:
    paths:
      - ".github/workflows/core-runtime.yml"
      - "TASKS.md"
      - "bin/**"
      - "config/ai/**"
      - "config/templates/**"
      - "config/omp/**"
      - "config/pi/**"
      - "config/shell-tools.sh"
      - "config/bashrc.tools.sh"
      - "config/zshrc.tools.sh"
      - "skills/**"
      - "docs/task-change-boundary.md"
      - "docs/project-init.md"
      - "install.sh"
      - "install-macos.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    name: Self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run authoritative core suite
        # The suite uses local fixtures and synthetic credentials only. Turnstile
        # network calls are replaced by its fixture; no provider login is needed.
        env:
          DOTFILES_DIR: ${{ github.workspace }}
          NINEROUTER_REMOTE_KEY: ""
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: bin/ai-doctor --self-test
        shell: bash
